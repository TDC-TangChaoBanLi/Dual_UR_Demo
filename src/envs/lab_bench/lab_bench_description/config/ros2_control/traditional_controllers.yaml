# ============================================================
# Robotiq 2F-85 controllers parameters
# ============================================================

# arm_A_g2f85_*
# [WARN] 必须和 launch 配置保持一致
arm_A_g2f85_gripper_controller:
  ros__parameters:
    joint: arm_A_robotiq_85_left_knuckle_joint

    max_effort_interface: arm_A_robotiq_85_left_knuckle_joint/effort
    max_effort: 50.0

    max_velocity_interface: arm_A_robotiq_85_left_knuckle_joint/velocity
    max_velocity: 0.5

    state_interfaces:
      - position
      - velocity

    allow_stalling: true
    stall_timeout: 0.05
    goal_tolerance: 0.02

arm_A_g2f85_activation_controller:
  ros__parameters:
    default: true


arm_B_g2f85_gripper_controller:
  ros__parameters:
    joint: arm_B_robotiq_85_left_knuckle_joint

    max_effort_interface: arm_B_robotiq_85_left_knuckle_joint/effort
    max_effort: 50.0

    max_velocity_interface: arm_B_robotiq_85_left_knuckle_joint/velocity
    max_velocity: 0.5

    state_interfaces:
      - position
      - velocity

    allow_stalling: true
    stall_timeout: 0.05
    goal_tolerance: 0.02

arm_B_g2f85_activation_controller:
  ros__parameters:
    default: true


# ============================================================
# DH-Robotics AG-95 controllers parameters
# ============================================================

# arm_A_dhag95_gripper_controller
# [WARN] 必须和 launch 配置保持一致
arm_A_dhag95_gripper_controller:
  ros__parameters:
    joint: arm_A_dhag95_gripper_finger1_joint

# arm_B_dhag95_gripper_controller
# [WARN] 必须和 launch 配置保持一致
arm_B_dhag95_gripper_controller:
  ros__parameters:
    joint: arm_B_dhag95_gripper_finger1_joint