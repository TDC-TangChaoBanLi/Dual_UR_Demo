      - arm_A_ur_elbow_joint
      - arm_A_ur_wrist_1_joint
      - arm_A_ur_wrist_2_joint
      - arm_A_ur_wrist_3_joint
    interface_name: effort

arm_A_ur_force_mode_controller:
  ros__parameters:
    tf_prefix: "arm_A_ur_"

arm_A_ur_friction_model_controller:
  ros__parameters:
    tf_prefix: "arm_A_ur_"

arm_A_ur_freedrive_mode_controller:
