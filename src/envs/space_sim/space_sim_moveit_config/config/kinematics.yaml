# 单臂链（6 个可动关节）用 KDL 数值 IK。
# arm_BOTH 故意不给 solver：双臂同步规划走"分臂 IK -> 合并 12 维 joint goal -> arm_BOTH 规划"
# 的路线（见 space_sim_task_control 的 DualArmPlanner），不需要 12 维解析 IK。
arm_A:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.0050000000000000001
  kinematics_solver_timeout: 0.0050000000000000001
arm_B:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.0050000000000000001
  kinematics_solver_timeout: 0.0050000000000000001
arm_BOTH:
  kinematics_solver: ""
