# moveit_controllers.yaml
# [WARN] space_sim 的 MuJoCo 环境只有 joint_trajectory_controller，
#        **没有** scaled_joint_trajectory_controller（见
#        space_sim_mujoco_description/config/ros2_control/traditional_controllers.yaml）。
#        所以这里只能列 joint_trajectory_controller，照搬 lab_bench 的
#        scaled_joint_trajectory_controller 会导致执行阶段找不到控制器。
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_A_ur_joint_trajectory_controller
    - arm_B_ur_joint_trajectory_controller

  arm_A_ur_joint_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - arm_A_ur_shoulder_pan_joint
      - arm_A_ur_shoulder_lift_joint
      - arm_A_ur_elbow_joint
      - arm_A_ur_wrist_1_joint
      - arm_A_ur_wrist_2_joint
      - arm_A_ur_wrist_3_joint

  arm_B_ur_joint_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - arm_B_ur_shoulder_pan_joint
      - arm_B_ur_shoulder_lift_joint
      - arm_B_ur_elbow_joint
      - arm_B_ur_wrist_1_joint
      - arm_B_ur_wrist_2_joint
      - arm_B_ur_wrist_3_joint
