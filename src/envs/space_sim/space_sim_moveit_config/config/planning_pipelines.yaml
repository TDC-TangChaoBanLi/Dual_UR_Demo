/**:
  ros__parameters:
    planning_pipelines:
      - ompl

    default_planning_pipeline: ompl

    ompl:
      request_adapters:
        - default_planning_request_adapters/ResolveConstraintFrames
        - default_planning_request_adapters/ValidateWorkspaceBounds
        - default_planning_request_adapters/CheckStartStateBounds
        - default_planning_request_adapters/CheckStartStateCollision

      planning_plugins:
        - ompl_interface/OMPLPlanner

      response_adapters:
        - default_planning_response_adapters/AddTimeOptimalParameterization
        - default_planning_response_adapters/ValidateSolution
        - default_planning_response_adapters/DisplayMotionPath

      start_state_max_bounds_error: 0.1

      planner_configs:
        # 默认规划器：快，先用它试
        RRTConnectkConfigDefault:
          type: geometric::RRTConnect
          range: 0.0
        # 备用规划器：RRTConnect 失败时（储存位/穹顶槽位这种窄空间）改用它
        RRTstarkConfigDefault:
          type: geometric::RRTstar
          range: 0.0
          goal_bias: 0.05
          delay_collision_checking: 1

      # 单臂组：projection 用肩部两个关节（与 UR 官方一致）
      arm_A:
        planner_configs:
          - RRTConnectkConfigDefault
          - RRTstarkConfigDefault
        projection_evaluator: joints(arm_A_ur_shoulder_pan_joint,arm_A_ur_shoulder_lift_joint)
        longest_valid_segment_fraction: 0.005

      arm_B:
        planner_configs:
          - RRTConnectkConfigDefault
          - RRTstarkConfigDefault
        projection_evaluator: joints(arm_B_ur_shoulder_pan_joint,arm_B_ur_shoulder_lift_joint)
        longest_valid_segment_fraction: 0.005

      # 双臂同步组（12 维）：projection 取两条臂的肩部关节。
      # longest_valid_segment_fraction 更要取小值，否则 12 维轨迹的碰撞检查会漏判。
      arm_BOTH:
        planner_configs:
          - RRTConnectkConfigDefault
          - RRTstarkConfigDefault
        projection_evaluator: joints(arm_A_ur_shoulder_pan_joint,arm_A_ur_shoulder_lift_joint,arm_B_ur_shoulder_pan_joint,arm_B_ur_shoulder_lift_joint)
        longest_valid_segment_fraction: 0.005
