# joint_limits.yaml：覆盖/补充 URDF 里的动力学属性。
#
# [WARN] 这里的值必须与 UR5e 的 URDF 限制兼容：仿真里关节由 MuJoCo 的 position actuator
#        驱动（kp 600/600/300/150/130/100），速度上限放太高会让轨迹在仿真中跟不上。
#        default_velocity_scaling_factor 越小越保守，装配任务先按 0.1 起步。
#
# [WARN] 本文件由 launch_controller 作为 `robot_description_planning` 参数整体载入
#        （见 start_moveit_group.launch.py:214）。因此下面两级键名不能改：
#          robot_description_planning.joint_limits.<joint>.*
#          robot_description_planning.cartesian_limits.*
#        `cartesian_limits` 是 **Pilz 工业运动规划器** 必需的；缺了它 move_group 在加载
#        Pilz 插件时会直接抛 ParameterUninitializedException 并退出。
#
# ⚠️⚠️ 千万不要给关节加 **位置限制**（`has_position_limits: true` + `min/max_position`）：
#    URDF 里 shoulder_pan / wrist_1..3 是 **continuous** 关节，MoveIt 的默认处理是
#    “无界/连续（SO(2)）”；一旦在这里写成有界转动（哪怕给 ±360°），OMPL 的状态空间就从
#    圆环变成 4π 长的区间，规划行为剧烈变差。实测（2026-09-17）：
#      * 加了位置限制：同一个 pre-grasp 目标（已用旧探测矩阵逐位验证位姿正确）
#        RRTConnect/RRTstar 各跑满 10 s × 3 次全部失败（IK 可解、起点与目标都无碰撞，
#        纯路径搜不到）；最外侧镜片直接抓不了。
#      * 去掉位置限制：同一目标 **0.09 s / 278 点** 一次成功。
#    同理不要随手加 has_effort_limits / has_jerk_limits 这类开关。
#    减速限制（has_deceleration_limits / max_deceleration，且**必须为负**）Pilz 会读，
#    但它是可选的：不写也能正常加载 Pilz。这里为与历史一致，不写。

default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

# Pilz LIN / CIRC 的笛卡尔速度/加速度上限（PTP 只用关节限制）
cartesian_limits:
  max_trans_vel: 1.0
  max_trans_acc: 2.25
  max_trans_dec: -5.0
  max_rot_vel: 1.57

joint_limits:
  arm_A_ur_shoulder_pan_joint:
    has_velocity_limits: true
    max_velocity: 1.5708
    has_acceleration_limits: true
    max_acceleration: 2.0
  arm_A_ur_shoulder_lift_joint:
    has_velocity_limits: true
    max_velocity: 1.5708
    has_acceleration_limits: true
    max_acceleration: 2.0
  arm_A_ur_elbow_joint:
    has_velocity_limits: true
    max_velocity: 1.5708
    has_acceleration_limits: true
    max_acceleration: 2.0
  arm_A_ur_wrist_1_joint:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 3.0
  arm_A_ur_wrist_2_joint:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 3.0
  arm_A_ur_wrist_3_joint:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 3.0

  arm_B_ur_shoulder_pan_joint:
    has_velocity_limits: true
    max_velocity: 1.5708
    has_acceleration_limits: true
    max_acceleration: 2.0
  arm_B_ur_shoulder_lift_joint:
    has_velocity_limits: true
    max_velocity: 1.5708
    has_acceleration_limits: true
    max_acceleration: 2.0
  arm_B_ur_elbow_joint:
    has_velocity_limits: true
    max_velocity: 1.5708
    has_acceleration_limits: true
    max_acceleration: 2.0
  arm_B_ur_wrist_1_joint:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 3.0
  arm_B_ur_wrist_2_joint:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 3.0
  arm_B_ur_wrist_3_joint:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 3.0
