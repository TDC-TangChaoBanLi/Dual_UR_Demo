controller_manager:
  ros__parameters:
    update_rate: 500  # Hz
    # 公共 broadcaster（也可以为每臂单独开一个）
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Arm A controllers
    arm_A_io_and_status_controller:
      type: ur_controllers/GPIOController

    arm_A_speed_scaling_state_broadcaster:
      type: ur_controllers/SpeedScalingStateBroadcaster

    arm_A_force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    arm_A_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm_A_scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController

    arm_A_forward_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    arm_A_forward_position_controller:
      type: position_controllers/JointGroupPositionController

    arm_A_force_mode_controller:
      type: ur_controllers/ForceModeController

    arm_A_freedrive_mode_controller:
      type: ur_controllers/FreedriveModeController

    arm_A_passthrough_trajectory_controller:
      type: ur_controllers/PassthroughTrajectoryController

    arm_A_tcp_pose_broadcaster:
      type: pose_broadcaster/PoseBroadcaster

    arm_A_ur_configuration_controller:
      type: ur_controllers/URConfigurationController

    arm_A_tool_contact_controller:
      type: ur_controllers/ToolContactController

    # Gripper controllers
    arm_A_robotiq_gripper_controller:
      type: position_controllers/GripperActionController
    arm_A_robotiq_activation_controller:
      type: robotiq_controllers/RobotiqActivationController

    # Arm B controllers (同上)
    arm_B_io_and_status_controller:
      type: ur_controllers/GPIOController

    arm_B_speed_scaling_state_broadcaster:
      type: ur_controllers/SpeedScalingStateBroadcaster

    arm_B_force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    arm_B_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm_B_scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController

    arm_B_forward_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    arm_B_forward_position_controller:
      type: position_controllers/JointGroupPositionController

    arm_B_force_mode_controller:
      type: ur_controllers/ForceModeController

    arm_B_freedrive_mode_controller:
      type: ur_controllers/FreedriveModeController

    arm_B_passthrough_trajectory_controller:
      type: ur_controllers/PassthroughTrajectoryController

    arm_B_tcp_pose_broadcaster:
      type: pose_broadcaster/PoseBroadcaster

    arm_B_ur_configuration_controller:
      type: ur_controllers/URConfigurationController

    arm_B_tool_contact_controller:
      type: ur_controllers/ToolContactController

    # Gripper controllers
    arm_B_robotiq_gripper_controller:
      type: position_controllers/GripperActionController
    arm_B_robotiq_activation_controller:
      type: robotiq_controllers/RobotiqActivationController

# ------- Arm A 的各 controller 的具体参数 -------
arm_A_speed_scaling_state_broadcaster:
  ros__parameters:
    state_publish_rate: 100.0
    tf_prefix: "$(var arm_A_prefix)"

arm_A_io_and_status_controller:
  ros__parameters:
    tf_prefix: "$(var arm_A_prefix)"

arm_A_ur_configuration_controller:
  ros__parameters:
    tf_prefix: "$(var arm_A_prefix)"

arm_A_force_torque_sensor_broadcaster:
  ros__parameters:
    sensor_name: $(var arm_A_prefix)ur_tcp_fts_sensor
    state_interface_names:
      - force.x
      - force.y
      - force.z
      - torque.x
      - torque.y
      - torque.z
    frame_id: $(var arm_A_prefix)ur_tool0
    topic_name: $(var arm_A_prefix)ur_ft_data

arm_A_joint_trajectory_controller:
  ros__parameters:
    joints:
      - $(var arm_A_prefix)ur_shoulder_pan_joint
      - $(var arm_A_prefix)ur_shoulder_lift_joint
      - $(var arm_A_prefix)ur_elbow_joint
      - $(var arm_A_prefix)ur_wrist_1_joint
      - $(var arm_A_prefix)ur_wrist_2_joint
      - $(var arm_A_prefix)ur_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      $(var arm_A_prefix)ur_shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
      $(var arm_A_prefix)ur_shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
      $(var arm_A_prefix)ur_elbow_joint: { trajectory: 0.2, goal: 0.1 }
      $(var arm_A_prefix)ur_wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
      $(var arm_A_prefix)ur_wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
      $(var arm_A_prefix)ur_wrist_3_joint: { trajectory: 0.2, goal: 0.1 }


arm_A_scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - $(var arm_A_prefix)ur_shoulder_pan_joint
      - $(var arm_A_prefix)ur_shoulder_lift_joint
      - $(var arm_A_prefix)ur_elbow_joint
      - $(var arm_A_prefix)ur_wrist_1_joint
      - $(var arm_A_prefix)ur_wrist_2_joint
      - $(var arm_A_prefix)ur_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
    speed_scaling_interface_name: $(var arm_A_prefix)speed_scaling/speed_scaling_factor

arm_A_passthrough_trajectory_controller:
  ros__parameters:
    tf_prefix: "$(var arm_A_prefix)"
    joints:
      - $(var arm_A_prefix)ur_shoulder_pan_joint
      - $(var arm_A_prefix)ur_shoulder_lift_joint
      - $(var arm_A_prefix)ur_elbow_joint
      - $(var arm_A_prefix)ur_wrist_1_joint
      - $(var arm_A_prefix)ur_wrist_2_joint
      - $(var arm_A_prefix)ur_wrist_3_joint
    state_interfaces:
      - position
      - velocity
    speed_scaling_interface_name: $(var arm_A_prefix)speed_scaling/speed_scaling_factor

arm_A_forward_velocity_controller:
  ros__parameters:
    joints:
      - $(var arm_A_prefix)ur_shoulder_pan_joint
      - $(var arm_A_prefix)ur_shoulder_lift_joint
      - $(var arm_A_prefix)ur_elbow_joint
      - $(var arm_A_prefix)ur_wrist_1_joint
      - $(var arm_A_prefix)ur_wrist_2_joint
      - $(var arm_A_prefix)ur_wrist_3_joint
    interface_name: velocity

arm_A_forward_position_controller:
  ros__parameters:
    joints:
      - $(var arm_A_prefix)ur_shoulder_pan_joint
      - $(var arm_A_prefix)ur_shoulder_lift_joint
      - $(var arm_A_prefix)ur_elbow_joint
      - $(var arm_A_prefix)ur_wrist_1_joint
      - $(var arm_A_prefix)ur_wrist_2_joint
      - $(var arm_A_prefix)ur_wrist_3_joint

arm_A_force_mode_controller:
  ros__parameters:
    tf_prefix: "$(var arm_A_prefix)"

arm_A_freedrive_mode_controller:
  ros__parameters:
    tf_prefix: "$(var arm_A_prefix)"

arm_A_tcp_pose_broadcaster:
  ros__parameters:
    frame_id: $(var arm_A_prefix)ur_base
    pose_name: $(var arm_A_prefix)ur_tcp_pose
    tf:
      child_frame_id: $(var arm_A_prefix)ur_tool0_controller

arm_A_tool_contact_controller:
  ros__parameters:
    tf_prefix: "$(var arm_A_prefix)"


# Gripper controllers
arm_A_robotiq_gripper_controller:
  ros__parameters:
    default: true
    joint: $(var arm_A_prefix)robotiq_85_left_knuckle_joint
    use_effort_interface: true
    use_speed_interface: true

arm_A_robotiq_activation_controller:
  ros__parameters:
    default: true

